name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "可选镜像标签；留空使用提交 SHA，手动发布不更新 latest"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: qpix-docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 生成镜像标签
        if: github.event_name != 'pull_request'
        id: meta
        env:
          CUSTOM_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/image-tags.sh
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 一次构建前后端；PR 只编译 amd64，发布时生成 amd64 / arm64 统一镜像。
      - name: 构建并推送镜像
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags || 'qpix:check' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=QPix
          cache-from: type=gha,scope=qpix
          cache-to: type=gha,scope=qpix,mode=max
      - name: 写入发布摘要
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '### QPix 统一镜像\n\n'
            printf '```text\n%s\n```\n\n' "$IMAGE_TAGS"
            printf 'Digest: `%s`\n\n' "$IMAGE_DIGEST"
            printf '架构：linux/amd64、linux/arm64。前后端位于同一镜像，使用同一端口。\n'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GH_REPO,,}:${RELEASE_TAG#v}"
          printf '统一镜像（linux/amd64、linux/arm64）：\n\n```sh\ndocker pull %s\n```\n\n前后端位于同一镜像，部署方法见 [部署文档](https://github.com/%s/blob/%s/docs/cicd.md)。\n' \
            "$image" "$GH_REPO" "$RELEASE_TAG" > release-notes.md
          args=(--repo "$GH_REPO" --verify-tag --title "QPix $RELEASE_TAG" --generate-notes --notes-file release-notes.md)
          # 预发布不标记为最新正式版，与镜像 latest 标签保持一致。
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          printf 'Release: https://github.com/%s/releases/tag/%s\n' "$GH_REPO" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
